<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - BizFlow</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <!-- LOGO -->

            <a href="{{ url_for('index') }}" class="auth-logo">
                Biz<span>Flow</span>
            </a>


            <!-- HEADING -->

            <h1>
                Create Your Account
            </h1>

            <p class="auth-subtitle">
                Start managing your business smarter with BizFlow.
            </p>


            <!-- SIGNUP FORM -->

            <form method="POST">


                <div class="auth-field">

                    <label for="business_name">
                        Business Name
                    </label>

                    <input
                        id="business_name"
                        type="text"
                        name="business_name"
                        placeholder="Enter your business name"
                        autocomplete="organization"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <input
                        id="confirm_password"
                        type="password"
                        name="confirm_password"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button type="submit" class="auth-btn">
                    Create Account
                </button>

            </form>


            <!-- LOGIN LINK -->

            <p class="auth-footer">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </p>

        </div>

    </div>

</div>


</body>

</html>
