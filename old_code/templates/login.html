<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - BizFlow</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <!-- LOGO -->

            <a href="{{ url_for('index') }}" class="auth-logo">
                Biz<span>Flow</span>
            </a>


            <!-- HEADING -->

            <h1>
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Login to manage your business.
            </p>


            <!-- LOGIN FORM -->

            <form method="POST">


                <div class="auth-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="remember-row">

                    <label class="remember">

                        <input
                            type="checkbox"
                            name="remember"
                        >

                        <span>Remember me</span>

                    </label>

                </div>


                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>


            <!-- SIGNUP LINK -->

            <p class="auth-footer">

                Don't have an account?

                <a href="{{ url_for('signup') }}">
                    Create an account
                </a>

            </p>

        </div>

    </div>

</div>

</body>

</html>
